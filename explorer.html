<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Present Perfect Explorer</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F39C12;
            --past: #95a5a6;
            --present: #2ecc71;
            --highlight: #e74c3c;
            --bg: #F9F9FB;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .explorer-container {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
        }

        /* Word Selection Buttons */
        .word-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .word-btn {
            background-color: #f1f2f6;
            border: 2px solid #dfe4ea;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            color: #555;
        }

        .word-btn:hover {
            background-color: #eccc68;
            border-color: var(--secondary);
            color: #333;
        }

        .word-btn.active {
            background-color: var(--secondary);
            border-color: var(--secondary);
            color: white;
            transform: scale(1.05);
        }

        /* Timeline Graphics */
        .timeline-box {
            position: relative;
            height: 120px;
            background-color: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 30px;
            padding: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .base-line {
            position: absolute;
            top: 60px;
            left: 10%;
            right: 10%;
            height: 4px;
            background-color: #bdc3c7;
            border-radius: 2px;
        }

        .time-label {
            position: absolute;
            top: 75px;
            font-weight: bold;
            font-size: 16px;
        }

        .label-past { left: 5%; color: var(--past); }
        .label-present { right: 5%; color: var(--present); }

        /* Dynamic Timeline Elements */
        #dynamic-visuals {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .marker-dot {
            position: absolute;
            top: 54px;
            width: 16px;
            height: 16px;
            background-color: var(--highlight);
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .marker-arrow {
            position: absolute;
            top: 59px;
            height: 6px;
            background-color: var(--highlight);
            z-index: 1;
        }

        .marker-arrow::after {
            content: '';
            position: absolute;
            right: -10px;
            top: -7px;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid var(--highlight);
        }

        .marker-bracket {
            position: absolute;
            top: 35px;
            height: 15px;
            border-top: 4px solid var(--highlight);
            border-left: 4px solid var(--highlight);
            border-right: 4px solid var(--highlight);
            border-radius: 4px 4px 0 0;
        }

        .floating-label {
            position: absolute;
            font-weight: bold;
            color: var(--highlight);
            transform: translateX(-50%);
            font-size: 14px;
        }

        /* Sentence and Rule Area */
        .content-area {
            min-height: 150px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .sentence-box {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .sentence-box .verb {
            color: var(--primary);
            font-weight: bold;
        }

        .sentence-box .target-word {
            background-color: #ffeaa7;
            padding: 2px 8px;
            border-radius: 5px;
            color: #d35400;
            font-weight: bold;
            box-shadow: 0 2px 0 #f39c12;
        }

        .rule-box {
            background-color: #e8f4fd;
            border-left: 5px solid var(--primary);
            padding: 20px;
            border-radius: 0 10px 10px 0;
            text-align: left;
            font-size: 18px;
            line-height: 1.5;
        }
        
        .placeholder-text {
            color: #95a5a6;
            font-style: italic;
            font-size: 20px;
            margin-top: 50px;
        }

    </style>
</head>
<body>

<div class="explorer-container">
    <h1>🕰️ Time Word Explorer</h1>
    <p>Click a word to see how it works in the Present Perfect tense!</p>

    <div class="word-buttons" id="btn-container">
        <!-- Buttons generated by JS -->
    </div>

    <div class="timeline-box">
        <div class="base-line"></div>
        <div class="time-label label-past">PAST</div>
        <div class="time-label label-present">PRESENT</div>
        <div id="dynamic-visuals"></div>
    </div>

    <div class="content-area" id="content-area">
        <div class="placeholder-text">👆 Click a word above to explore!</div>
    </div>
</div>

<script>
    const dictionary = {
        since: {
            word: "Since",
            html: `
                <div class="marker-dot" style="left: 30%;"></div>
                <div class="marker-arrow" style="left: 30%; width: 55%;"></div>
                <div class="floating-label" style="left: 30%; top: 25px;">Start Point</div>
            `,
            sentence: `I <span class="verb">have lived</span> here <span class="target-word">since</span> 2020.`,
            rule: `<b>Rule:</b> Use <i>since</i> with a specific starting point in the past (like a year, a day, a month, or a specific event). The action continues to the present.`
        },
        for: {
            word: "For",
            html: `
                <div class="marker-bracket" style="left: 30%; width: 55%;"></div>
                <div class="floating-label" style="left: 57%; top: 15px;">Length of Time</div>
            `,
            sentence: `I <span class="verb">have lived</span> here <span class="target-word">for</span> five years.`,
            rule: `<b>Rule:</b> Use <i>for</i> to talk about a length or duration of time (how long something has been happening).`
        },
        already: {
            word: "Already",
            html: `
                <div class="marker-dot" style="left: 60%;"></div>
                <div class="floating-label" style="left: 60%; top: 25px;">Done!</div>
            `,
            sentence: `I <span class="verb">have</span> <span class="target-word">already</span> <span class="verb">finished</span> my homework.`,
            rule: `<b>Rule:</b> Use <i>already</i> to say that something happened sooner than expected. It usually goes between <i>have/has</i> and the verb.`
        },
        yet: {
            word: "Yet",
            html: `
                <div class="marker-dot" style="left: 90%; background-color: #8e44ad;"></div>
                <div class="floating-label" style="left: 90%; top: 25px; color: #8e44ad;">Waiting...</div>
            `,
            sentence: `I <span class="verb">haven't finished</span> my homework <span class="target-word">yet</span>.`,
            rule: `<b>Rule:</b> Use <i>yet</i> for things we expect to happen, but haven't happened up to now. It is used in <b>negative</b> sentences and <b>questions</b>, and always goes at the <b>end</b> of the sentence.`
        },
        just: {
            word: "Just",
            html: `
                <div class="marker-dot" style="left: 85%;"></div>
                <div class="floating-label" style="left: 85%; top: 25px;">A moment ago</div>
            `,
            sentence: `Be careful! I <span class="verb">have</span> <span class="target-word">just</span> <span class="verb">washed</span> the floor.`,
            rule: `<b>Rule:</b> Use <i>just</i> to describe an action that happened a very short time ago. It goes between <i>have/has</i> and the verb.`
        },
        ever: {
            word: "Ever",
            html: `
                <div class="marker-bracket" style="left: 15%; width: 75%; border-color: #2980b9;"></div>
                <div class="floating-label" style="left: 52%; top: 15px; color: #2980b9;">Any time in your life?</div>
            `,
            sentence: `<span class="verb">Have</span> you <span class="target-word">ever</span> <span class="verb">visited</span> Japan?`,
            rule: `<b>Rule:</b> Use <i>ever</i> to mean 'at any time in your life up to now'. It is almost always used in <b>questions</b> and goes between the subject and the verb.`
        },
        never: {
            word: "Never",
            html: `
                <div class="marker-bracket" style="left: 15%; width: 75%; border-color: #c0392b;"></div>
                <div class="floating-label" style="left: 52%; top: 15px; color: #c0392b;">Not once in your life ( X )</div>
            `,
            sentence: `I <span class="verb">have</span> <span class="target-word">never</span> <span class="verb">eaten</span> sushi.`,
            rule: `<b>Rule:</b> Use <i>never</i> to mean 'not at any time before now'. Because 'never' is already negative, we use it with positive verbs (have/has, not haven't/hasn't).`
        }
    };

    const btnContainer = document.getElementById('btn-container');
    const dynamicVisuals = document.getElementById('dynamic-visuals');
    const contentArea = document.getElementById('content-area');

    // Create buttons
    Object.keys(dictionary).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'word-btn';
        btn.innerText = dictionary[key].word;
        btn.onclick = () => selectWord(key, btn);
        btnContainer.appendChild(btn);
    });

    function selectWord(key, selectedBtn) {
        // Handle button styling
        document.querySelectorAll('.word-btn').forEach(btn => btn.classList.remove('active'));
        selectedBtn.classList.add('active');

        const data = dictionary[key];

        // Animate content change
        contentArea.style.opacity = 0;
        
        setTimeout(() => {
            // Update Timeline
            dynamicVisuals.innerHTML = data.html;

            // Update Text
            contentArea.innerHTML = `
                <div class="sentence-box">${data.sentence}</div>
                <div class="rule-box">${data.rule}</div>
            `;
            
            contentArea.style.opacity = 1;
        }, 200);
    }
</script>

</body>
</html>
